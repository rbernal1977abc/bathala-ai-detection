<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - BIAD</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            text-align: center;
        }
        .error-box h1 {
            font-size: 6rem;
            color: #ff0040;
            font-family: 'Orbitron', monospace;
        }
        .error-box p {
            color: #888;
            margin: 20px 0;
        }
        .error-box a {
            color: #00ff41;
            text-decoration: none;
            border: 1px solid #00ff41;
            padding: 10px 30px;
            border-radius: 10px;
            transition: 0.3s;
        }
        .error-box a:hover {
            background: #00ff41;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>
    <div class="error-container">
        <div class="error-box">
            <h1>404</h1>
            <p>Page not found in the intelligence database</p>
            <a href="index.html">Return to Base</a>
        </div>
    </div>
</body>
</html>
